"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'everforest'

format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[palettes.everforest]
green = '#A7C080'
yellow = '#DBBC7F'
blue = '#7FBBB3'
red = '#E67E80'
aqua = '#83C092'
orange = '#E69875'

[directory]
style = 'bold aqua'
truncation_length = 3
truncate_to_repo = false

[git_branch]
style = 'bold green'

[git_status]
style = 'yellow'

[cmd_duration]
min_time = 500
style = 'orange'
format = 'took [$duration]($style) '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vicmd_symbol = '[❮](bold yellow)'
